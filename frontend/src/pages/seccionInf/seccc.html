<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recursos sobre Violencia de Género</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap");
      body {
        font-family: "Jenson", sans-serif;
        background-color: #e6e6fa; /* Color lavanda */
      }
    </style>
  </head>
  <body>
    <div class="contenedorPrincipal bg-gray-100 min-h-screen">
      <div class="max-w-5xl mx-auto">
        <h1 class="text-4xl font-semibold text-center text-red-600 mb-12">
          Recursos sobre Violencia de Género
        </h1>
        <div
          id="articleContainer"
          class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"
        ></div>
        <div class="text-center mt-8">
          <button
            onclick="openCreateArticleModal()"
            class="bg-red-600 text-white px-4 py-2 rounded-md hover:bg-red-700 transition"
          >
            Crear Artículo
          </button>
        </div>
      </div>

      <!-- Modal para Crear Artículo -->
      <div
        id="createArticleModal"
        class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 hidden"
      >
        <div class="bg-white rounded-xl p-6 max-w-md w-full">
          <h2 class="text-2xl font-semibold text-red-600 mb-4">
            Nuevo Artículo
          </h2>
          <input
            id="newArticleTitle"
            type="text"
            placeholder="Título del artículo"
            class="w-full mb-4 p-2 border border-gray-300 rounded"
          />
          <textarea
            id="newArticleContent"
            placeholder="Descripción del artículo"
            class="w-full mb-4 p-2 border border-gray-300 rounded"
            rows="4"
          ></textarea>
          <button
            onclick="publishArticle()"
            class="bg-red-600 text-white px-4 py-2 rounded-md hover:bg-red-700 transition"
          >
            Publicar
          </button>
          <button
            onclick="closeCreateArticleModal()"
            class="text-gray-500 mt-4 hover:underline"
          >
            Cancelar
          </button>
        </div>
      </div>
    </div>

    <script>
      const articles = [
        {
          id: 1,
          title: "Comprendiendo la Violencia Psicológica",
          content:
            "Conoce cómo identificar y enfrentar la violencia psicológica.",
          redirectUrl: "/psicologica",
        },
        {
          id: 2,
          title: "Identificando la Violencia Sexual",
          content:
            "Descubre los recursos para prevenir y denunciar la violencia sexual.",
          redirectUrl: "/sexual",
        },
        {
          id: 3,
          title: "Afrontando la Violencia Física",
          content: "Encuentra información y ayuda sobre la violencia física.",
          redirectUrl: "/fisica",
        },
        {
          id: 4,
          title: "Recursos de Ayuda y Apoyo",
          content:
            "Accede a recursos de ayuda y apoyo para víctimas de violencia.",
          redirectUrl: "/ayuda",
        },
      ];

      const articleContainer = document.getElementById("articleContainer");
      const createArticleModal = document.getElementById("createArticleModal");

      function createArticleCard(article) {
        const card = document.createElement("div");
        card.className = "bg-white rounded-xl shadow-md p-6";

        card.innerHTML = `
          <h2 class="text-xl font-semibold text-red-600 mb-2">${article.title}</h2>
          <p class="text-black mb-4">${article.content}</p>
          <button onclick="redirectTo('${article.redirectUrl}')" class="bg-red-600 text-white px-4 py-2 rounded-md hover:bg-red-700 transition">
            Ver más
          </button>
        `;

        return card;
      }

      function redirectTo(url) {
        window.location.href = url;
      }

      function openCreateArticleModal() {
        createArticleModal.classList.remove("hidden");
      }

      function closeCreateArticleModal() {
        createArticleModal.classList.add("hidden");
      }

      function publishArticle() {
        const title = document.getElementById("newArticleTitle").value;
        const content = document.getElementById("newArticleContent").value;

        if (title && content) {
          const newArticle = {
            id: articles.length + 1,
            title: title,
            content: content,
            redirectUrl: "#",
          };

          articles.push(newArticle);
          articleContainer.appendChild(createArticleCard(newArticle));
          closeCreateArticleModal();

          // Limpiar los campos
          document.getElementById("newArticleTitle").value = "";
          document.getElementById("newArticleContent").value = "";
        } else {
          alert("Por favor, complete ambos campos antes de publicar.");
        }
      }

      articles.forEach((article) => {
        articleContainer.appendChild(createArticleCard(article));
      });
    </script>
  </body>
</html>
